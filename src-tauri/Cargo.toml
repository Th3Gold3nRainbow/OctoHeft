[package]
name = "octoheft"
version = "2.0.1"
description = "OctoHeft High-Speed Download Accelerator"
authors = ["OctoHeft Software"]
license = "MIT"
edition = "2021"

[package.metadata.tauri-winres]
OriginalFilename = "OctoHeft.exe"
InternalName = "OctoHeft"

[lib]
name = "octoheft_engine_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
futures-util = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
url = "2.5"
bytes = "1.7"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
flate2 = "1.0"
mp4 = "0.14"
winreg = "0.56"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "fmt"] }
tracing-appender = "0.2"
thiserror = "2.0"
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Globalization",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
